name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false # Standard library only; no go.sum.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o nss .
      - name: Check help and version without credentials
        run: |
          env -u NSS_TOKEN ./nss --help
          env -u NSS_TOKEN ./nss events count --help
          env -u NSS_TOKEN ./nss --version
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
