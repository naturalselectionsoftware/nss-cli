name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check tap credential for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo 'Configure HOMEBREW_TAP_TOKEN with Contents read/write access to naturalselectionsoftware/homebrew-tap.' >&2
            exit 1
          fi
      - name: Publish release archives, checksums, and Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
